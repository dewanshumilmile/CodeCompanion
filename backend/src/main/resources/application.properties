# Application

app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# Token encryption - replace the placeholder with a strong random password

app.token-encryptor-password=REPLACE_WITH_A_LONG_RANDOM_PASSWORD
app.token-encryptor-salt=0123456789abcdef

# GitHub OAuth

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Gemini API - Chat

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

# Gemini API - Embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.metadata-mode=EMBED

# PostgreSQL

spring.datasource.url=jdbc:postgresql://localhost:5433/devpilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL Vector Store

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=NONE

# Backend port

server.port=8081
